name: ITD external review gate

# Security boundary:
# - repository_dispatch runs this workflow definition from the default branch,
#   then loads reviewer tooling from the trusted default branch and
#   requires broker-signed maker provenance bound to the current PR head; it
#   never executes scripts from the PR while OPENAI_API_KEY is present.
# - the candidate oracle runs in a separate job without reviewer tooling,
#   durable review evidence, or the API credential.
# - fork PRs and missing protected-environment approval fail with UNAVAILABLE,
#   never a fabricated green result.
on:
  repository_dispatch:
    types: [itd-external-review]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: itd-external-review-budget
  cancel-in-progress: false

jobs:
  candidate-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head: ${{ steps.refs.outputs.head }}
      base: ${{ steps.refs.outputs.base }}
      merge_base: ${{ steps.candidate.outputs.merge_base }}
      head_repository: ${{ steps.refs.outputs.head_repository }}
    steps:
      - name: Resolve exact PR refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.client_payload.pull_request }}
        run: |
          set -euo pipefail
          data="$(gh api "repos/$GH_REPO/pulls/$PR")"
          PR_DATA="$data" python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          row = json.loads(os.environ["PR_DATA"])
          head_repository = row["head"]["repo"]["full_name"]
          if head_repository != os.environ["GH_REPO"]:
              raise SystemExit("UNAVAILABLE: fork PRs are not eligible for this protected gate")
          if (row["base"]["repo"]["full_name"] != os.environ["GH_REPO"]
                  or row["base"]["ref"] != row["base"]["repo"]["default_branch"]):
              raise SystemExit(
                  "UNVERIFIED: PR base must be the protected default branch"
              )
          with open(sys.argv[1], "a", encoding="utf-8") as handle:
              handle.write(f"head={row['head']['sha']}\n")
              handle.write(f"base={row['base']['sha']}\n")
              handle.write(f"head_repository={head_repository}\n")
          PY

      - name: Materialize the exact PR candidate without reviewer secrets
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ steps.refs.outputs.head_repository }}
          ref: ${{ steps.refs.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare immutable candidate coordinates
        id: candidate
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          head_sha="$(git rev-parse HEAD)"
          test "$head_sha" = "${{ steps.refs.outputs.head }}"
          git fetch --no-tags "https://github.com/${{ github.repository }}.git" "$BASE_SHA"
          merge_base="$(git merge-base "$BASE_SHA" "$head_sha")"
          test -n "$merge_base"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          git reset --soft "$merge_base"
          test -n "$(git diff --cached --name-only)"
          test "$(git write-tree)" = \
            "$(git rev-parse "$head_sha^{tree}")"
          git reset --hard "$head_sha"

      - name: Run the prospective merge oracle without reviewer state
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          ORACLE: ${{ vars.ITD_EXTERNAL_REVIEW_ORACLE }}
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff "$BASE_SHA"
          oracle="${ORACLE:-bash tests/run-all.sh --quick}"
          bash -lc "$oracle"

  exact-candidate-review:
    needs: candidate-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: itd-external-review
    steps:
      - name: Check out trusted ITD tooling from the default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: .itd-tooling
          persist-credentials: false

      - name: Verify broker-signed maker provenance
        id: provenance
        env:
          PR_NUMBER: ${{ github.event.client_payload.pull_request }}
          EXPECTED_HEAD: ${{ needs.candidate-oracle.outputs.head }}
          EXPECTED_BASE: ${{ needs.candidate-oracle.outputs.base }}
          INPUT_HEAD: ${{ github.event.client_payload.maker_head }}
          INPUT_BASE: ${{ github.event.client_payload.maker_base }}
          INPUT_VENDOR: ${{ github.event.client_payload.maker_vendor }}
          INPUT_MODEL: ${{ github.event.client_payload.maker_model }}
          INPUT_SESSION: ${{ github.event.client_payload.maker_session }}
          INPUT_SIGNATURE: ${{ github.event.client_payload.maker_signature }}
          PROVENANCE_HMAC_KEY: ${{ secrets.ITD_PROVENANCE_HMAC_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, re
          values = {
              "pr": os.environ.get("PR_NUMBER", "").strip(),
              "head": os.environ.get("INPUT_HEAD", "").strip().lower(),
              "base": os.environ.get("INPUT_BASE", "").strip().lower(),
              "vendor": os.environ.get("INPUT_VENDOR", "").strip(),
              "model": os.environ.get("INPUT_MODEL", "").strip(),
              "session": os.environ.get("INPUT_SESSION", "").strip(),
          }
          key = os.environ.get("PROVENANCE_HMAC_KEY", "")
          supplied = os.environ.get("INPUT_SIGNATURE", "").strip().lower()
          if not key or not all(values.values()):
              raise SystemExit("UNVERIFIED: signed maker provenance is incomplete")
          if not re.fullmatch(r"[1-9][0-9]*", values["pr"]):
              raise SystemExit("UNVERIFIED: malformed pull request provenance")
          if values["head"] != os.environ["EXPECTED_HEAD"].strip().lower():
              raise SystemExit("UNVERIFIED: maker provenance is stale for the PR head")
          if values["base"] != os.environ["EXPECTED_BASE"].strip().lower():
              raise SystemExit("UNVERIFIED: maker provenance is stale for the PR base")
          if not re.fullmatch(r"[0-9a-f]{40}", values["head"]) or not re.fullmatch(
                  r"[0-9a-f]{40}", values["base"]):
              raise SystemExit("UNVERIFIED: malformed maker commit provenance")
          if any(not re.fullmatch(r"[^\r\n]{1,200}", values[name])
                 for name in ("vendor", "model", "session")):
              raise SystemExit("UNVERIFIED: unsafe maker provenance field")
          if not re.fullmatch(r"[0-9a-f]{64}", supplied):
              raise SystemExit("UNVERIFIED: malformed maker provenance signature")
          payload = json.dumps(
              values, ensure_ascii=False, separators=(",", ":"), sort_keys=True
          )
          expected = hmac.new(key.encode(), payload.encode(), hashlib.sha256).hexdigest()
          if not hmac.compare_digest(supplied, expected):
              raise SystemExit("UNVERIFIED: maker provenance signature is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for name, value in values.items():
                  handle.write(f"{name}={value}\n")
          PY

      - name: Materialize and stage the exact PR candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ needs.candidate-oracle.outputs.head_repository }}
          ref: ${{ needs.candidate-oracle.outputs.head }}
          fetch-depth: 0
          path: .itd-candidate
          persist-credentials: false

      - name: Stage only the complete base-to-head candidate
        env:
          BASE_SHA: ${{ needs.candidate-oracle.outputs.merge_base }}
          BASE_TIP_SHA: ${{ needs.candidate-oracle.outputs.base }}
        run: |
          set -euo pipefail
          git -C .itd-candidate fetch --no-tags \
            "https://github.com/${{ github.repository }}.git" "$BASE_TIP_SHA"
          git -C .itd-candidate reset --soft "$BASE_SHA"
          test -n "$(git -C .itd-candidate diff --cached --name-only)"
          test "$(git -C .itd-candidate write-tree)" = \
            "${{ needs.candidate-oracle.outputs.head }}" ||
            test "$(git -C .itd-candidate write-tree)" = \
              "$(git -C .itd-candidate rev-parse \
                '${{ needs.candidate-oracle.outputs.head }}^{tree}')"

      - name: Restore the serialized monthly usage ledger
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p .itd-candidate/.itd-memory
          artifact_id=""
          while IFS=$'\t' read -r candidate_id run_id; do
            run_path="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.path')"
            run_branch="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_branch')"
            if [[ "$run_path" = */external-review-gate.yml \
                  && "$run_branch" = "$DEFAULT_BRANCH" ]]; then
              artifact_id="$candidate_id"
              break
            fi
          done < <(
            gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[]
                | select(.name | startswith("itd-external-review-budget-"))
                | select(.workflow_run != null)
                | select(.expired == false)
                | [.created_at, (.id | tostring),
                   (.workflow_run.id | tostring)] | @tsv' \
              | sort -r | cut -f 2,3
          )
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" \
              > /tmp/itd-external-review-budget.zip
            unzip -p /tmp/itd-external-review-budget.zip \
              '*external-review-usage.jsonl' \
              > .itd-candidate/.itd-memory/external-review-usage.jsonl
          fi

      - name: Run managed external checker without executing candidate code
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ITD_EXTERNAL_REVIEW_EGRESS_OK: "1"
          MAKER_VENDOR: ${{ steps.provenance.outputs.vendor }}
          MAKER_MODEL: ${{ steps.provenance.outputs.model }}
          MAKER_SESSION: ${{ steps.provenance.outputs.session }}
        run: |
          set -euo pipefail
          python3 .itd-tooling/skills/_shared/itd_external_reviewer.py review \
            --root .itd-candidate \
            --maker-vendor "$MAKER_VENDOR" \
            --maker-model "$MAKER_MODEL" \
            --maker-session "$MAKER_SESSION" \
            --risk high --mode ci > external-review-result.json
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          row = json.load(open("external-review-result.json", encoding="utf-8"))
          if row.get("status") != "PASSED":
              raise SystemExit(f"external checker is not accepted: {row.get('status')}")
          with open(sys.argv[1], "a", encoding="utf-8") as handle:
              handle.write(f"prompt={row['artifacts']['prompt']}\n")
              handle.write(f"report={row['artifacts']['report']}\n")
              handle.write(f"metadata={row['artifacts']['metadata']}\n")
              handle.write(f"checker_provider={row['checker']['vendor']}\n")
              handle.write(f"checker_model={row['checker']['model']}\n")
              handle.write(f"checker_session={row['checker']['session']}\n")
          PY

      - name: Validate metadata and bind the isolated oracle result
        id: evidence
        env:
          MAKER_VENDOR: ${{ steps.provenance.outputs.vendor }}
          MAKER_MODEL: ${{ steps.provenance.outputs.model }}
          MAKER_SESSION: ${{ steps.provenance.outputs.session }}
          CHECKER_PROVIDER: ${{ steps.review.outputs.checker_provider }}
          CHECKER_MODEL: ${{ steps.review.outputs.checker_model }}
          CHECKER_SESSION: ${{ steps.review.outputs.checker_session }}
          ORACLE_JOB_RESULT: ${{ needs.candidate-oracle.result }}
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          python3 .itd-tooling/skills/_shared/itd_external_reviewer.py validate \
            --root .itd-candidate --risk high \
            --metadata "${{ steps.review.outputs.metadata }}"
          vl="$GITHUB_WORKSPACE/.itd-tooling/skills/_shared/itd_verification_loop.py"
          machine="$(python3 "$vl" machine --root .itd-candidate \
            --unit-id "PR-${{ github.event.client_payload.pull_request }}:external-review" \
            --risk-tier high \
            --command "candidate=test '$ORACLE_JOB_RESULT' = success")"
          checker="$(python3 "$vl" checker --root .itd-candidate \
            --unit-id "PR-${{ github.event.client_payload.pull_request }}:external-review" \
            --risk-tier high --mode full \
            --prompt-file "${{ steps.review.outputs.prompt }}" \
            --report "${{ steps.review.outputs.report }}" \
            --maker-provider "$MAKER_VENDOR" --maker-model "$MAKER_MODEL" \
            --maker-session "$MAKER_SESSION" \
            --checker-provider "$CHECKER_PROVIDER" --checker-model "$CHECKER_MODEL" \
            --checker-session "$CHECKER_SESSION")"
          adjudication="$(python3 "$vl" adjudicate --root .itd-candidate \
            --unit-id "PR-${{ github.event.client_payload.pull_request }}:external-review" \
            --risk-tier high --machine "$machine" --checker "$checker")"
          python3 "$vl" check --root .itd-candidate --receipt "$adjudication"
          echo "adjudication=$adjudication" >> "$GITHUB_OUTPUT"

      - name: Upload privacy-safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: itd-external-review-${{ github.event.client_payload.pull_request }}
          if-no-files-found: error
          retention-days: 14
          path: |
            external-review-result.json
            .itd-candidate/.itd-memory/verification-loop/receipts/
            .itd-candidate/.itd-memory/verification-loop/prompts/
            .itd-candidate/.itd-memory/verification-loop/reports/
            .itd-candidate/.itd-memory/verification-loop/external-review/

      - name: Persist the serialized monthly usage ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: itd-external-review-budget-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 45
          path: .itd-candidate/.itd-memory/external-review-usage.jsonl

  publish-pr-head-status:
    if: always() && needs.candidate-oracle.outputs.head != ''
    needs: [candidate-oracle, exact-candidate-review]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish the gate result on the verified PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.candidate-oracle.outputs.head }}
          ORACLE_RESULT: ${{ needs.candidate-oracle.result }}
          REVIEW_RESULT: ${{ needs.exact-candidate-review.result }}
        run: |
          set -euo pipefail
          state=failure
          description="ITD external review did not produce accepted evidence"
          if [ "$ORACLE_RESULT" = success ] && [ "$REVIEW_RESULT" = success ]; then
            state=success
            description="ITD external review evidence accepted"
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="ITD external review gate" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
