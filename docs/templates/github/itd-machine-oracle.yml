name: ITD machine oracle

on:
  # Install this template only after its trust anchors exist on the protected
  # default branch; the retained legacy gate protects that bootstrap merge.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: itd-machine-${{ github.repository }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  machine-oracle:
    name: ITD machine oracle
    # Organization policy must bind this label to an ephemeral runner image
    # whose image digest is reviewed and rotated as a control-plane change.
    # A mutable GitHub-hosted `*-latest` label is not gate authority.
    runs-on: [self-hosted, linux, x64, itd-machine-oracle-v1]
    timeout-minutes: 60
    steps:
      - name: Materialize the exact GitHub test candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize the protected-base verification contract
        # Bootstrap order is fail-closed: install the initial trust-anchor
        # objects under pre-existing controls, verify them in protected base,
        # and only then make this pinned workflow a required ruleset check.
        # There is intentionally no candidate-owned contract fallback.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: protected-base
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize the pinned ITD control plane
        # Security authority is the server-side organization-ruleset
        # `workflows` rule configured with this path, central repository_id,
        # and immutable release SHA. GitHub selects that pinned workflow run;
        # a candidate-owned workflow with the same job/check name cannot
        # satisfy the Workflows rule. github.workflow_ref/workflow_sha are
        # runtime coordinates of the already-selected direct workflow source,
        # not a self-issued allowlist. The live enrollment/doctor separately
        # require the ruleset's repository_id/path/sha to match the release.
        # GitHub documents these fields for the defining workflow:
        # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context
        # Ruleset WorkflowFileReference includes repository_id/path/sha:
        # https://docs.github.com/en/rest/orgs/rules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: hihol-labs/idea-to-deploy
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the event and checkout coordinates
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CHECK_SHA: ${{ github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              test "$EVENT_BASE_SHA" = "$(git -C candidate rev-parse HEAD^1)"
              test "$EVENT_HEAD_SHA" = "$(git -C candidate rev-parse HEAD^2)"
              ;;
            merge_group)
              test "$EVENT_CHECK_SHA" = "$EVENT_HEAD_SHA"
              git -C candidate merge-base --is-ancestor \
                "$EVENT_BASE_SHA" "$EVENT_CHECK_SHA"
              ;;
            *) echo "UNVERIFIED: unsupported event $EVENT_NAME" >&2; exit 1 ;;
          esac
          test "$EVENT_CHECK_SHA" = "$(git -C candidate rev-parse HEAD)"
          test "$EVENT_BASE_SHA" = "$(git -C protected-base rev-parse HEAD)"
          case "$WORKFLOW_REF" in
            hihol-labs/idea-to-deploy/.github/workflows/itd-machine-oracle.yml@*) ;;
            *) echo "UNVERIFIED: unexpected workflow source $WORKFLOW_REF" >&2; exit 1 ;;
          esac
          test "$WORKFLOW_SHA" = "$(git -C control rev-parse HEAD)"
          test "$EVENT_HEAD_SHA" != "$EVENT_BASE_SHA"
          test -f protected-base/.itd/VERIFICATION_CONTRACT.json
          test -f control/scripts/itd_machine_oracle.py

      - name: Run the protected-base content-bound verifier contract
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail
          python3 -I control/scripts/itd_machine_oracle.py \
            --root candidate \
            --trusted-contract-root protected-base \
            --contract .itd/VERIFICATION_CONTRACT.json \
            --receipt "$GITHUB_WORKSPACE/.itd-machine-receipt.json"

      - name: Preserve the exact machine receipt
        if: always() && hashFiles('.itd-machine-receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: itd-machine-${{ github.run_id }}-${{ github.run_attempt }}
          path: .itd-machine-receipt.json
          if-no-files-found: error
          retention-days: 30
